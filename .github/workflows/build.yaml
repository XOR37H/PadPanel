name: Build and Release Unsigned IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: macos-15
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Select Xcode
      run: sudo xcode-select -switch /Applications/Xcode.app

    - name: Compile Device Archive for iOS 15
      run: |
        xcodebuild archive \
          -project UltraKiosk.xcodeproj \
          -scheme "UltraKiosk" \
          -sdk iphoneos \
          -archivePath $PWD/build/UltraKiosk.xcarchive \
          IPHONEOS_DEPLOYMENT_TARGET=15.0 \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          COMPILER_INDEX_STORE_ENABLE=NO

    - name: Package Payload to IPA
      run: |
        mkdir -p Payload
        cp -r build/UltraKiosk.xcarchive/Products/Applications/*.app Payload/
        zip -r UltraKiosk_Unsigned.ipa Payload

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: UltraKiosk iOS 15 Build #${{ github.run_number }}
        body: |
          Backward-compatible compilation targeting iOS 15.0+ for manual distribution and local device deployment.
        draft: false
        prerelease: false
        files: UltraKiosk_Unsigned.ipa
