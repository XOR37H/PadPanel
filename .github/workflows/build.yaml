name: Build IPA

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15

    steps:
    # 1. Fixed the deprecation warning by upgrading checkout version to v7
    - uses: actions/checkout@v7

    # 2. Relaxed Xcode selection to let the runner pick the active version safely
    - name: Select Xcode
      run: sudo xcode-select -switch /Applications/Xcode.app

    - name: Xcode version
      run: /usr/bin/xcodebuild -version

    # 3. Enhanced build arguments to explicitly auto-resolve dependencies
    - name: Compile Device Archive
      run: |
        xcodebuild archive \
          -project UltraKiosk.xcodeproj \
          -scheme "UltraKiosk" \
          -sdk iphoneos \
          -archivePath $PWD/build/UltraKiosk.xcarchive \
          -allowProvisioningUpdates \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          COMPILER_INDEX_STORE_ENABLE=NO

    - name: Package Payload to IPA
      run: |
        mkdir -p Payload
        cp -r build/UltraKiosk.xcarchive/Products/Applications/*.app Payload/
        zip -r UltraKiosk_Unsigned.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: UltraKiosk-TrollStore-IPA
        path: UltraKiosk_Unsigned.ipa
