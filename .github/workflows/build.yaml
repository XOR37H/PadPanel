```yaml
name: Build UltraKiosk for iOS 15

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    permissions:
      contents: write

    steps:

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 16.4
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

          echo "========== XCODE =========="
          xcodebuild -version

          echo
          echo "========== IOS SDK =========="
          xcrun --sdk iphoneos --show-sdk-version

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project UltraKiosk.xcodeproj \
            -scheme UltraKiosk

      - name: Build unsigned device archive
        run: |
          rm -rf build

          set -o pipefail

          xcodebuild archive \
            -project UltraKiosk.xcodeproj \
            -scheme UltraKiosk \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/UltraKiosk.xcarchive" \
            -destination "generic/platform=iOS" \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee build.log

      - name: Show compiler errors
        if: failure()
        run: |
          echo
          echo "=========================================="
          echo "       SWIFT COMPILER ERRORS"
          echo "=========================================="

          grep -B 5 -A 10 -E "error:|fatal error:" build.log || true

          echo
          echo "=========================================="
          echo "          LAST 200 BUILD LOG LINES"
          echo "=========================================="

          tail -n 200 build.log

      - name: Show built application information
        if: success()
        run: |
          APP=$(find build/UltraKiosk.xcarchive/Products/Applications \
            -maxdepth 1 \
            -name "*.app" \
            -print \
            -quit)

          echo "========== APPLICATION =========="
          echo "$APP"

          echo
          echo "========== AR
