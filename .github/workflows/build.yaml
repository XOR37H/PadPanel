name: Build Historical iOS 15 Compatible IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: macos-15
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0 # Fetches full history so we can roll back the code

    # Rolls back the codebase to a version that supports iOS 15
    - name: Rollback to iOS 15 Compatible Codebase
      run: |
        git checkout $(git rev-list -n 1 --before="2024-06-01" main)

    - name: Select Xcode
      run: sudo xcode-select -switch /Applications/Xcode.app

    - name: Compile Device Archive
      run: |
        xcodebuild archive \
          -project UltraKiosk.xcodeproj \
          -scheme "UltraKiosk" \
          -sdk iphoneos \
          -archivePath $PWD/build/UltraKiosk.xcarchive \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          COMPILER_INDEX_STORE_ENABLE=NO

    - name: Package Payload to IPA
      run: |
        mkdir -p Payload
        cp -r build/UltraKiosk.xcarchive/Products/Applications/*.app Payload/
        zip -r UltraKiosk_Legacy_Unsigned.ipa Payload

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.legacy-${{ github.run_number }}
        name: UltraKiosk iOS 15 Legacy Build
        body: |
          Compiled from a historical snapshot to ensure framework compatibility with iOS 15.8.8 hardware.
        draft: false
        prerelease: false
        files: UltraKiosk_Legacy_Unsigned.ipa
