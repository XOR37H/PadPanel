name: Build UltraKiosk for iOS 15

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    permissions:
      contents: write

    steps:

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 16
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | sort -V | tail -n 1)
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH=$(find /Applications -maxdepth 1 -name "Xcode*.app" | sort -V | tail -n 1)
          fi
          echo "Selected Xcode: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

          echo "========== XCODE =========="
          xcodebuild -version

          echo
          echo "========== IOS SDK =========="
          xcrun --sdk iphoneos --show-sdk-version

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project UltraKiosk.xcodeproj \
            -scheme UltraKiosk

      - name: Build unsigned device archive
        run: |
          rm -rf build

          set -o pipefail

          xcodebuild archive \
            -project UltraKiosk.xcodeproj \
            -scheme UltraKiosk \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/UltraKiosk.xcarchive" \
            -destination "generic/platform=iOS" \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee build.log

      - name: Show compiler errors
        if: failure()
        run: |
          echo
          echo "=========================================="
          echo "       SWIFT COMPILER ERRORS"
          echo "=========================================="

          grep -B 5 -A 10 -E "error:|fatal error:" build.log || true

          echo
          echo "=========================================="
          echo "          LAST 200 BUILD LOG LINES"
          echo "=========================================="

          tail -n 200 build.log

      - name: Show built application information
        if: success()
        run: |
          APP=$(find build/UltraKiosk.xcarchive/Products/Applications \
            -maxdepth 1 \
            -name "*.app" \
            -print \
            -quit)

          echo "========== APPLICATION =========="
          echo "$APP"

          echo
          echo "========== ARCHITECTURE =========="
          file "$APP/UltraKiosk"

          echo
          echo "========== DEPLOYMENT TARGET =========="
          /usr/libexec/PlistBuddy \
            -c "Print :MinimumOSVersion" \
            "$APP/Info.plist" || true

          echo
          echo "========== EMBEDDED FRAMEWORKS =========="
          find "$APP/Frameworks" \
            -maxdepth 1 \
            -type d \
            -print 2>/dev/null || true

      - name: Package IPA
        if: success()
        run: |
          rm -rf Payload
          mkdir Payload

          cp -R \
            build/UltraKiosk.xcarchive/Products/Applications/*.app \
            Payload/

          # Ensure MinimumOSVersion is explicitly 15.0 for iPad Air 2 / iOS 15.8.8
          APP_PLIST=$(find Payload -name "Info.plist" -maxdepth 2 | head -n 1)
          if [ -n "$APP_PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion 15.0" "$APP_PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :MinimumOSVersion string 15.0" "$APP_PLIST" 2>/dev/null || true
            echo "Verified MinimumOSVersion in Payload:"
            /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP_PLIST" || true
          fi

          zip -qr -y \
            UltraKiosk_iOS15_arm64_unsigned.ipa \
            Payload

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios15-build-${{ github.run_number }}
          name: UltraKiosk iOS 15 Build ${{ github.run_number }}
          body: |
            UltraKiosk iOS 15 compatibility build.

            Build configuration:
            - Xcode 16.4
            - iOS deployment target 15.0
            - arm64
            - Generic iOS device
            - Unsigned
            - Intended for TrollStore installation
          draft: false
          prerelease: true
          files: UltraKiosk_iOS15_arm64_unsigned.ipa
