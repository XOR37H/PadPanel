name: Build TrollStore IPA

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # This adds a manual "Run" button in the GitHub actions UI

jobs:
  build-ipa:
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v4

    - name: Select Xcode
      run: sudo xcode-select -switch /Applications/Xcode_16.2.app || sudo xcode-select -switch /Applications/Xcode_16.app

    - name: Xcode version
      run: /usr/bin/xcodebuild -version

    # Build the actual hardware archive (.xcarchive) without signing requirements
    - name: Compile Device Archive
      run: |
        xcodebuild archive \
          -project UltraKiosk.xcodeproj \
          -scheme "UltraKiosk" \
          -sdk iphoneos \
          -archivePath $PWD/build/UltraKiosk.xcarchive \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          COMPILER_INDEX_STORE_ENABLE=NO

    # Structure the binary files into the standard iOS Payload wrapper
    - name: Package Payload to IPA
      run: |
        mkdir -p Payload
        cp -r build/UltraKiosk.xcarchive/Products/Applications/*.app Payload/
        zip -r UltraKiosk_Unsigned.ipa Payload

    # Upload the final IPA directly to your browser for easy downloading
    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: UltraKiosk-TrollStore-IPA
        path: UltraKiosk_Unsigned.ipa
